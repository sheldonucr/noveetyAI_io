<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NoveetyAI">
  <title>NoveetyAI</title>
  <desc>An N formed by two chiplet die stacks on an interposer, joined by an interconnect diagonal.</desc>
  <defs>
    <linearGradient id="nv-diag" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee6c5"/>
      <stop offset="0.55" stop-color="#4d9dff"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
  </defs>

  <!-- interconnect diagonal: die stack -> die stack -->
  <path d="M18 15 L46 49" fill="none" stroke="url(#nv-diag)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- left die stack (cool) -->
  <rect x="8"  y="10" width="20" height="7" rx="2" fill="#2ee6c5" opacity="0.38"/>
  <rect x="8"  y="19" width="20" height="7" rx="2" fill="#2ee6c5" opacity="0.58"/>
  <rect x="8"  y="28" width="20" height="7" rx="2" fill="#2ee6c5" opacity="0.78"/>
  <rect x="8"  y="37" width="20" height="7" rx="2" fill="#2ee6c5"/>

  <!-- right die stack (warm) -->
  <rect x="36" y="10" width="20" height="7" rx="2" fill="#b48cff"/>
  <rect x="36" y="19" width="20" height="7" rx="2" fill="#b48cff" opacity="0.78"/>
  <rect x="36" y="28" width="20" height="7" rx="2" fill="#b48cff" opacity="0.58"/>
  <rect x="36" y="37" width="20" height="7" rx="2" fill="#b48cff" opacity="0.38"/>

  <!-- interposer / substrate -->
  <rect x="6" y="48" width="52" height="6" rx="3" fill="#4d9dff"/>
</svg>
